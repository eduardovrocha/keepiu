version: '3.8'

# Production compose — all services containerised.
# Before first deploy:
#   1. Copy .env.example to .env and fill in real values.
#   2. Place TLS certificates in ./ssl/cert.pem and ./ssl/key.pem.
#   3. docker compose -f docker-compose.prod.yml up -d

services:

  # ── Database ────────────────────────────────────────────────────────────────
  db:
    image: ankane/pgvector:v0.5.1
    container_name: keepiu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signalvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-signalvault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signalvault}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache / broker ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: keepiu-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: keepiu-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-signalvault}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-signalvault}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "false"
      APP_MODE: ${APP_MODE:-multi_user}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      PROCESSING_MODE: ${PROCESSING_MODE:-worker}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # entrypoint.sh waits for DB, runs alembic, then execs CMD
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: keepiu-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-signalvault}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-signalvault}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "false"
      APP_MODE: ${APP_MODE:-multi_user}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      PROCESSING_MODE: ${PROCESSING_MODE:-worker}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info -Q processing,default --concurrency 2

  # ── Flower (Celery monitor) ─────────────────────────────────────────────────
  flower:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: keepiu-flower
    restart: unless-stopped
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - redis
    ports:
      - "127.0.0.1:5555:5555"
    command: >
      celery -A app.workers.celery_app flower
        --port=5555
        --basic_auth=${FLOWER_BASIC_AUTH:-admin:changeme}

  # ── Frontend (static, served by nginx inside the image) ────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://yourdomain.com}
        VITE_TELEGRAM_BOT_LINK: ${VITE_TELEGRAM_BOT_LINK:-https://t.me/YourBotName}
        VITE_APP_MODE: ${APP_MODE:-multi_user}
    container_name: keepiu-frontend
    restart: unless-stopped
    # Not exposed directly — Nginx reverse-proxy routes to it
    expose:
      - "80"

  # ── Nginx reverse proxy + TLS ───────────────────────────────────────────────
  nginx:
    build:
      context: ./apps/nginx
      dockerfile: Dockerfile
    container_name: keepiu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  certbot_www:
